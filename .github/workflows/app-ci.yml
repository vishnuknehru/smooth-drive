name: app-ci

on:
  push:
    branches: [main]
    paths: ['app/**', '.github/workflows/app-ci.yml']
  pull_request:
    paths: ['app/**', '.github/workflows/app-ci.yml']

defaults:
  run:
    working-directory: app

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs
      - name: Verify generated code is committed
        run: git diff --exit-code
      - name: Format
        run: dart format --set-exit-if-changed lib test
      - run: flutter analyze --fatal-infos
      - run: flutter test --coverage
      - name: Report coverage (gate enforced from Sprint 13)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq lcov
          lcov --ignore-errors unused --remove coverage/lcov.info \
            '**/*.g.dart' '**/*.freezed.dart' \
            '**/main.dart' '**/app.dart' \
            '**/geolocator_location_service.dart' '**/flutter_tts_voice_service.dart' \
            -o coverage/filtered.lcov.info
          PCT=$(lcov --summary coverage/filtered.lcov.info 2>&1 | awk '/lines/ {gsub("%","",$2); print $2}')
          echo "Filtered line coverage: ${PCT}%"
          awk -v p="$PCT" 'BEGIN { if (p < 80.0) print "::warning::Coverage " p "% is below the 80% target" }'
      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: app/coverage/filtered.lcov.info

  build-apk:
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: smoothdrive-apk
          path: app/build/app/outputs/flutter-apk/app-release.apk
